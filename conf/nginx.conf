# logops 的 nginx 配置：容器内以非 root（nginx 用户）运行，只监听 8080
# 与默认配置的三处差别：
#   1. listen 8080（非 root 不能绑 1024 以下端口）
#   2. pid 放 /tmp（/var/run 非 root 不可写）
#   3. 各类 temp_path 放 /tmp（/var/cache/nginx 非 root 不可写）

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # 与 nginx combined 兼容：analyze.sh 依赖 $1=IP、$4=[time、$7=URL、$9=status
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # 健康检查专用路径：必须 access_log off，否则每 10 秒一次的探活
        # 会混进访问日志，让 analyze.sh 算出的"总访问量"虚增
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # analyze.sh 的产物（report.md / summary.csv）挂到这里，可直接浏览
        location /report/ {
            alias /usr/share/nginx/html/report/;
            autoindex on;
            charset utf-8;
        }
    }
}
